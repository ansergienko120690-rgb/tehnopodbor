<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ТехноПодбор">
<title>ТехноПодбор — поиск и сравнение бытовой техники</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root,[data-theme=dark]{--bg:#0c0c0d;--sf:#141416;--sf2:#1b1c1f;--line:#2a2b2f;--tx:#f1efea;--mut:#8f8d88;--acc:#c9a26b;--acc2:rgba(201,162,107,.13);--onacc:#0c0c0d;
  --best:rgba(201,162,107,.16);--besttx:#e7c996;--bad:#e0806f;--good:#9fcf9f;--stage:radial-gradient(120% 90% at 50% 38%,#3a3b40 0%,#202125 48%,#141416 100%);--shadow:0 20px 40px -20px rgba(0,0,0,.7);--glass:rgba(12,12,13,.78)}
[data-theme=light]{--bg:#f2f1ed;--sf:#ffffff;--sf2:#ebe9e3;--line:#dcd9d1;--tx:#141414;--mut:#7a776f;--acc:#9b7646;--acc2:rgba(155,118,70,.1);--onacc:#fff;
  --best:rgba(155,118,70,.13);--besttx:#7a5a30;--bad:#b4442f;--good:#3d7a45;--stage:radial-gradient(120% 90% at 50% 38%,#ffffff 0%,#ecebe6 55%,#e2e0d9 100%);--shadow:0 20px 40px -24px rgba(0,0,0,.25);--glass:rgba(242,241,237,.82)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.disp,h1,h2,h3{font-family:Jost,Inter,sans-serif;font-weight:300;letter-spacing:.08em;text-transform:uppercase}
.cap{font-family:Jost,Inter,sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-weight:400}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
/* шапка */
header{position:sticky;top:0;z-index:7;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
header .wm{text-align:center;font-family:Jost,sans-serif;font-weight:400;font-size:15px;letter-spacing:.42em;text-transform:uppercase;padding-left:.42em;cursor:pointer}
header .wm b{font-weight:500;color:var(--acc)}
.iconbtn{width:40px;height:40px;border:none;background:none;display:grid;place-items:center;cursor:pointer;color:var(--tx);padding:0}
.iconbtn svg{width:21px;height:21px}
main{padding:0 0 calc(150px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
.pad{padding:0 16px}
/* кнопки */
.btn{border:1px solid var(--line);background:transparent;border-radius:2px;padding:12px 18px;font-family:Jost,sans-serif;font-size:12.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;white-space:nowrap;text-align:center;text-decoration:none;display:inline-block;color:var(--tx);transition:.15s}
.btn:hover{border-color:var(--tx)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.sm{padding:8px 12px;font-size:11px}
.btn.full{width:100%;margin-top:10px}
.btn.danger{color:var(--bad)}
/* герой категории */
.hero{position:relative;background:var(--stage);height:min(64vw,360px);overflow:hidden;border-bottom:1px solid var(--line)}
.hero .illo{position:absolute;right:0;top:8%;height:84%;width:48%}
.hero .txt{position:absolute;left:16px;bottom:18px;right:50%}
.hero h1{margin:6px 0 6px;line-height:1.05;letter-spacing:.06em;cursor:pointer}
.hero h1 .ch{font-size:.5em;color:var(--acc);vertical-align:middle;margin-left:4px}
.hero .sub{color:var(--mut);font-size:13px}
.hero .all{position:absolute;left:16px;top:16px}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab2{border:none;background:none;padding:14px 0 12px;font-family:Jost,sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);white-space:nowrap;cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px}
.tab2.on{color:var(--tx);border-color:var(--acc)}
/* поиск и фильтры */
.searchbar{display:flex;gap:10px;align-items:center;padding:14px 16px 6px}
.searchbar input{flex:1;border:none;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px;border-radius:0;outline:none;min-width:0}
.searchbar input:focus{border-color:var(--acc)}
input[type=number],input:not([type]),input[type=search],select{border:1px solid var(--line);background:var(--sf);border-radius:2px;padding:10px 12px;width:100%;min-width:0;outline:none}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.filters{margin:8px 16px;background:var(--sf);border:1px solid var(--line);padding:16px;display:grid;gap:14px}
.fl{display:grid;gap:7px;font-size:13px;color:var(--mut)}
.fl b{color:var(--tx);font-weight:500}
.fgroup{font-family:Jost,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:2px;padding:7px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.listhead{display:flex;justify-content:space-between;align-items:center;margin:12px 16px 12px;gap:10px}
.listhead select{width:auto;border:none;background-color:transparent;font-size:13px;color:var(--mut);padding:4px 24px 4px 4px}
/* сетка товаров */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--bg);cursor:pointer;display:flex;flex-direction:column;position:relative}
.card .stage{aspect-ratio:1/1;background:var(--stage);position:relative;display:grid;place-items:center;overflow:hidden}
.card .stage .illo{position:absolute;inset:8%;width:84%;height:84%;transition:transform .35s}
.card:hover .stage .illo{transform:scale(1.04)}
.card .ov{position:absolute;top:6px;display:flex;gap:2px}
.card .ov.l{left:6px} .card .ov.r{right:6px}
.ib{width:34px;height:34px;border-radius:50%;border:none;background:var(--glass);display:grid;place-items:center;cursor:pointer;color:var(--tx);padding:0}
.ib svg{width:17px;height:17px}
.ib.on{color:var(--acc)}
.ib.on.fav svg{fill:currentColor}
.card .info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .model{font-size:14.5px;font-weight:500;line-height:1.25}
.card .key{font-size:12.5px;color:var(--mut);line-height:1.35;margin-top:2px}
.card .bot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.price{font-family:Jost,sans-serif;font-weight:400;font-size:17px;letter-spacing:.02em}
.rating{font-size:12px;color:var(--acc)}
.tag{font-style:normal;font-size:10px;padding:1px 6px;border:1px solid var(--acc);color:var(--acc);letter-spacing:.1em;margin-left:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.45);vertical-align:-2px;flex:none}
.dots{display:inline-flex;gap:4px}
.colors{display:flex;flex-wrap:wrap;gap:4px 12px}
.colors span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.yes{color:var(--tx)} .no,.na{color:var(--mut)}
.empty,.empty-state{text-align:center;color:var(--mut);padding:40px 20px}
.empty-state h2{color:var(--tx);font-size:22px}
.hint{font-size:12.5px;color:var(--mut);padding:0 16px}
.why{border-left:1px solid var(--acc);padding:4px 0 4px 10px;font-size:12.5px;display:grid;gap:2px;margin-top:6px}
.why b{font-family:Jost,sans-serif;font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--acc)}
.plus{color:var(--good)} .minus{color:var(--bad)}
.warn{border:1px solid var(--acc);color:var(--besttx);padding:12px 14px;margin:0 16px 14px;font-size:13px}
.section{padding:28px 16px 8px}
.section h2{font-size:18px;margin:4px 0 14px}
/* сравнение */
.cmp-head{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:10px;padding:24px 16px 4px}
.cmp-head h2{font-size:22px;margin:4px 0 0}
.vis{background:var(--stage);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 8px}
.vis .scale{width:100%;height:auto;max-height:52vh;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:12.5px;padding:6px 16px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:2px;display:inline-block}
.tablewrap{overflow:auto;max-height:calc(100dvh - 140px - env(safe-area-inset-top) - env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
table.cmp{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13.5px}
.cmp th,.cmp td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;background:var(--bg)}
.cmp td{min-width:max(132px,calc((min(100vw,820px) - 140px) / var(--n)));max-width:230px;position:relative}
.cmp tbody th,.cmp tfoot th,.cmp thead th.corner{position:sticky;left:0;z-index:2;width:112px;min-width:112px;max-width:112px;color:var(--mut);font-weight:400;font-size:12.5px;box-shadow:1px 0 0 var(--line),6px 0 10px -8px rgba(0,0,0,.5)}
.cmp thead th{position:sticky;top:0;z-index:3;padding:8px 26px 10px 10px;box-shadow:0 1px 0 var(--line),0 6px 10px -8px rgba(0,0,0,.5);min-width:max(132px,calc((min(100vw,820px) - 140px) / var(--n)));font-weight:400}
.cmp thead th.corner{z-index:5;vertical-align:bottom;padding-right:10px}
.cmp thead .mini{height:64px;background:var(--stage);margin:0 -16px 6px -10px;display:grid;place-items:center}
.cmp thead .mini .illo{height:58px;width:90%}
.cmp thead .model{font-size:13.5px;font-weight:500}
.cmp thead .brand{font-size:10.5px}
.cmp tfoot th,.cmp tfoot td{position:sticky;bottom:0;z-index:3;box-shadow:0 -1px 0 var(--line);border-bottom:none;background:var(--sf)}
.cmp tfoot th{z-index:5}
.cmp .hp{font-family:Jost,sans-serif;margin-top:2px}
.cmp tr.grp th,.cmp tr.grp td{background:var(--sf);color:var(--acc);font-family:Jost,sans-serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;padding:9px 10px 7px}
.cmp tr.same td{color:var(--mut)}
.cmp td.best{background:var(--best);color:var(--besttx);font-weight:500}
.cmp td.win{color:var(--acc);font-family:Jost,sans-serif;font-size:15px}
.cmp .bar{display:block;height:2px;background:var(--line);margin-top:7px;max-width:120px}
.cmp .bar i{display:block;height:100%;background:var(--mut)}
.cmp td.best .bar i{background:var(--acc)}
.cmp .x{position:absolute;top:6px;right:4px;border:none;background:var(--glass);color:var(--mut);cursor:pointer;font-size:12px;width:22px;height:22px;border-radius:50%;z-index:2}
.cmp .colors{flex-direction:column;align-items:flex-start}
.brand{font-family:Jost,sans-serif;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
/* подбор и каталог-лист */
.wiz{padding:0 16px}
.wiz h2{font-size:22px;margin:22px 0 6px}
.sub{color:var(--mut);margin:2px 0 14px;font-size:13.5px}
.pgroup{margin:22px 0 0}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--bg);border:none;padding:0 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;text-align:left;color:var(--tx)}
.tile .st{aspect-ratio:1/1;background:var(--stage);position:relative;overflow:hidden;margin-bottom:8px;min-height:0}
.tile .st .illo{position:absolute;inset:13%;width:74%;height:74%}
.tile span{font-size:12px;line-height:1.25;padding:0 8px}
.tile small{color:var(--mut);font-size:11px;padding:0 8px}
.tile.on span{color:var(--acc)}
.progress{height:1px;background:var(--line);margin:18px 0 10px}
.progress i{display:block;height:100%;background:var(--acc);transition:width .25s}
.wizcat{display:flex;gap:14px;align-items:center;margin-top:10px}
.wizcat .st{width:72px;height:72px;background:var(--stage);display:grid;place-items:center;flex:none;overflow:hidden}
.wizcat .illo{width:80%;height:80%}
.opts{display:grid;gap:0;margin:14px 0;border-top:1px solid var(--line)}
.opt{text-align:left;border:none;border-bottom:1px solid var(--line);background:none;padding:16px 4px;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--tx)}
.opt::after{content:'';width:16px;height:16px;border:1px solid var(--mut);border-radius:50%;flex:none}
.opt.on{color:var(--acc)}
.opt.on::after{border-color:var(--acc);background:radial-gradient(var(--acc) 45%,transparent 50%)}
.wiznav{display:flex;justify-content:space-between;gap:10px}
.prow{display:flex;justify-content:space-between;width:100%;border:none;border-bottom:1px solid var(--line);background:none;padding:13px 2px;cursor:pointer;text-align:left;gap:10px;color:var(--tx)}
.prow small{color:var(--mut)}
/* нижняя навигация */
nav{position:fixed;bottom:0;left:0;right:0;z-index:7;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:none;background:none;padding:10px 0 9px;display:grid;justify-items:center;gap:4px;font-family:Jost,sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);cursor:pointer;position:relative}
.tab svg{width:21px;height:21px;stroke-width:1.5}
.tab.on{color:var(--acc)}
#cmpcount{position:absolute;top:5px;left:calc(50% + 8px);background:var(--acc);color:var(--onacc);font-size:10px;border-radius:9px;min-width:16px;height:16px;line-height:16px;font-family:Inter,sans-serif;letter-spacing:0;font-weight:600}
#cmpbar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:6;background:var(--tx);color:var(--bg);padding:8px 8px 8px 16px;display:flex;justify-content:space-between;align-items:center;max-width:796px;margin:0 auto;box-shadow:var(--shadow);font-size:13px;gap:10px}
#cmpbar .btn{border-color:var(--acc)}
#cmpbar[hidden]{display:none}
/* лист / карточка модели */
#sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);display:none;align-items:end}
#sheet.on{display:flex}
#sheet .panel{background:var(--bg);width:100%;max-width:820px;margin:0 auto;max-height:94vh;overflow:auto;padding:0 0 calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out;border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
#sheet .closebtn{position:sticky;top:10px;display:block;margin:10px 10px 0 auto;z-index:3;border:none;background:var(--glass);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--tx)}
#sheet .body>h2{padding:18px 16px 0;margin:0;font-size:20px}
#sheet .body>.pad{padding:0 16px}
.pstage{background:var(--stage);height:min(92vw,440px);display:grid;place-items:center;margin-top:-46px;border-bottom:1px solid var(--line)}
.pstage .illo{width:88%;height:86%}
.recolor{display:flex;gap:10px;justify-content:center;padding:14px 0 4px;flex-wrap:wrap}
.recolor button{border:none;background:none;padding:3px;cursor:pointer;border-radius:50%;box-shadow:0 0 0 1px transparent}
.recolor button.on{box-shadow:0 0 0 1px var(--acc)}
.recolor .sw{width:22px;height:22px}
.recolor-l{text-align:center;font-size:12px;color:var(--mut)}
.ptitle{padding:14px 16px 0}
.ptitle h2{font-size:24px;margin:6px 0 8px;letter-spacing:.05em}
.ptitle .price{font-size:24px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px}
table.kv{width:100%;border-collapse:collapse}
.kv th,.kv td{padding:11px 0;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
.kv th{color:var(--mut);font-weight:400;width:52%;padding-right:12px}
.ksec{font-family:Jost,sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin:26px 0 4px}
.form{display:grid;gap:12px;padding:0 16px}
.cchk input{display:none}
.cchk:has(input:checked){border-color:var(--acc);color:var(--acc);background:var(--acc2)}
body.locked{overflow:hidden}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 18px;opacity:0;transition:.2s;pointer-events:none;z-index:20;font-size:13px;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* 3D */
span.illo{display:block}
.illo>svg,.illo>img{width:100%;height:100%;display:block;object-fit:contain}
.r3img{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0}}
.pstage{position:relative;place-items:stretch}
.pstage .r3live{position:absolute;inset:46px 0 70px;display:flex;align-items:center;justify-content:center;touch-action:none}
.pstage .r3live>.illo{width:88%;height:96%}
.r3view{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.r3view:active{cursor:grabbing}
.vtools{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.vtools button{border:1px solid var(--line);background:var(--glass);color:var(--tx);font:500 10.5px/1 Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:7px 10px;border-radius:2px;cursor:pointer}
.vtools button.on{border-color:var(--acc);color:var(--acc)}
.vhint{position:absolute;bottom:46px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--mut);pointer-events:none}
.sc3{position:relative}
.sc3 img{width:100%;display:block}
.sc3 .lb{position:absolute;bottom:0;transform:translateX(-50%);text-align:center;font-size:11.5px;line-height:1.25;white-space:nowrap}
.sc3 .lb b{display:block;font:400 10.5px Jost,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.sc3 .lb span{color:var(--mut)}
.sc3 .pad3{padding-bottom:40px}
.vgrid .card{height:var(--vrow,auto);overflow:hidden}
.parts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:12px 12px 0}
.parts button{border:1px solid var(--line);background:none;color:var(--mut);font:500 10.5px/1 Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:9px 12px;border-radius:2px;cursor:pointer}
.parts button.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.parts-cap{text-align:center;font-size:12px;color:var(--mut);padding-top:6px}
.vsp{grid-column:1/-1;background:var(--bg)}
.dimnote{position:absolute;top:54px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut);pointer-events:none}
/* отзывы */
.revhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 6px}
.revsum{display:flex;gap:18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.revsum .big{font:300 40px/1 Jost,sans-serif;color:var(--acc)}
.revsum .sub{margin:0}
.stars{color:var(--acc);letter-spacing:2px;white-space:nowrap}
.stars .off{color:var(--line)}
.rev{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:5px;font-size:14px}
.rev .who{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut)}
.rev .who b{color:var(--tx);font-weight:500}
.rev .pl{color:var(--good)} .rev .mn{color:var(--bad)}
.rev .lnk{border:none;background:none;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
.starpick{display:flex;gap:4px}
.starpick button{border:none;background:none;font-size:30px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.starpick button.on{color:var(--acc)}
textarea{border:1px solid var(--line);background:var(--sf);border-radius:2px;padding:10px 12px;width:100%;min-width:0;outline:none;font:inherit;color:inherit;resize:vertical;min-height:64px}
textarea:focus,input:focus,select:focus{border-color:var(--acc)}
.revnote{font-size:12.5px;color:var(--mut);padding:8px 0}
.total{font:400 18px Jost,sans-serif;color:var(--tx)}
.cmp td.win .total{color:var(--acc)}
.cmp tfoot td small{display:block;color:var(--mut);font:12px Inter,sans-serif;letter-spacing:0;margin-top:2px}
</style>

<script>// ===== ТехноПодбор v3 — логика приложения =====
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rub = n => n.toLocaleString('ru-RU') + ' ₽';
const num = v => String(v).replace('-', '−').replace('.', ',');
const empty = v => v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);

const store = {
  get(k, d) { try { const v = localStorage.getItem('tp_' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tp_' + k, JSON.stringify(v)); } catch {} },
};

const catById = id => CATEGORIES.find(c => c.id === id);
const S = {
  view: 'catalog',
  cat: catById(store.get('cat', 'fridge')) ? store.get('cat', 'fridge') : 'fridge',
  theme: store.get('theme', 'dark'),
  q: '', sort: 'rating', maxPrice: null, brands: new Set(), colors: new Set(), sf: {},
  showFilters: false,
  compare: store.get('compare', []),
  favs: new Set(store.get('favs', [])),
  custom: store.get('custom', []),
  onlyDiff: false,
  detail: null,
  wiz: null,
};

const all = () => PRODUCTS.concat(S.custom);
const byId = id => all().find(p => p.id === id);
const inCat = cat => all().filter(p => p.cat === cat);
const topOf = cat => inCat(cat).slice().sort((a, b) => b.rating - a.rating)[0];  // для обложек — по рейтингу магазина, чтобы не прыгали
const save = () => { store.set('compare', S.compare); store.set('favs', [...S.favs]); store.set('custom', S.custom); store.set('cat', S.cat); store.set('theme', S.theme); };
S.compare = S.compare.filter(byId);

const swatch = code => COLORS[code] ? `<i class="sw" style="background:${COLORS[code][1]}" title="${COLORS[code][0]}"></i>` : '';
function fmt(spec, v) {
  if (empty(v)) return '<span class="na">—</span>';
  if (spec.t === 'b') return v ? '<span class="yes">Есть</span>' : '<span class="no">Нет</span>';
  if (spec.t === 'c') return `<span class="colors">${v.map(c => `<span>${swatch(c)}${COLORS[c] ? COLORS[c][0] : esc(c)}</span>`).join('')}</span>`;
  if (spec.t === 'n') return num(v) + (spec.u ? ' ' + spec.u : '');
  return esc(v);
}
const dims = p => !empty(p.specs.width) && !empty(p.specs.height) ? `${num(p.specs.width)}×${num(p.specs.height)}${empty(p.specs.depth) ? '' : '×' + num(p.specs.depth)} см` : '';

function norm(cat, spec, v) {
  if (empty(v) || !spec) return 0;
  if (spec.t === 'b') return v ? 1 : 0;
  if (spec.t === 'e') { const i = ENERGY.indexOf(v); return i < 0 ? 0 : 1 - i / (ENERGY.length - 1); }
  if (spec.t !== 'n') return 0;
  const vals = inCat(cat).map(p => p.specs[spec.k]).filter(x => typeof x === 'number');
  const mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx === mn) return 1;
  const r = (v - mn) / (mx - mn);
  return spec.b === 'l' ? 1 - r : r;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}
function applyTheme() {
  document.documentElement.dataset.theme = S.theme;
  $('#theme').innerHTML = S.theme === 'dark' ? ICON.sun : ICON.moon;
  document.querySelector('meta[name=theme-color]').content = S.theme === 'dark' ? '#0c0c0d' : '#f2f1ed';
}

// ---------- Действия ----------
function toggleCompare(id) {
  const p = byId(id);
  if (S.compare.includes(id)) S.compare = S.compare.filter(x => x !== id);
  else {
    if (S.compare.length && byId(S.compare[0])?.cat !== p.cat) { S.compare = []; toast('Сравнение начато заново: другая категория'); }
    if (S.compare.length >= 4) { toast('Можно сравнить до 4 моделей'); return; }
    S.compare.push(id); toast('Добавлено в сравнение');
  }
  save(); render();
}
function toggleFav(id) { S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); save(); render(); }
function setCat(id) { S.cat = id; S.brands.clear(); S.colors.clear(); S.sf = {}; S.maxPrice = null; S.q = ''; save(); }

// ---------- Карточка ----------
function keyLine(p) {
  const c = catById(p.cat);
  return c.specs.filter(s => s.g !== 'Габариты и цвет' && s.t !== 'e' && s.t !== 'b' && !empty(p.specs[s.k])).slice(0, 2)
    .map(s => s.t === 's' ? esc(p.specs[s.k]) : `${esc(s.l.toLowerCase())} ${fmt(s, p.specs[s.k])}`).join(' · ');
}
function card(p, extra = '', showCat = false) {
  const c = catById(p.cat), inC = S.compare.includes(p.id), fav = S.favs.has(p.id);
  return `<article class="card" data-open="${p.id}">
    <div class="stage">${illo(p)}
      <div class="ov l"><button class="ib ${inC ? 'on' : ''}" data-cmp="${p.id}" aria-label="Сравнить">${inC ? ICON.cmpOn : ICON.cmp}</button></div>
      <div class="ov r"><button class="ib fav ${fav ? 'on' : ''}" data-fav="${p.id}" aria-label="В избранное">${ICON.heart}</button></div>
    </div>
    <div class="info">
      <div class="brand">${showCat ? esc(c.name) + ' · ' : ''}${esc(p.brand)}${p.custom ? '<i class="tag">моя</i>' : ''}</div>
      <div class="model">${esc(p.model)}</div>
      <div class="key">${keyLine(p)}</div>
      ${extra}
      <div class="bot"><div><div class="price">${p.price ? rub(p.price) : '—'}</div>${ratingLine(p)}</div>
        <span class="dots">${(p.specs.colors || []).slice(0, 5).map(swatch).join('')}</span></div>
    </div>
  </article>`;
}

// ---------- Каталог ----------
function filtered() {
  const c = catById(S.cat), q = S.q.trim().toLowerCase();
  const list = inCat(S.cat).filter(p => {
    if (q && !(p.brand + ' ' + p.model).toLowerCase().includes(q)) return false;
    if (S.maxPrice && p.price > S.maxPrice) return false;
    if (S.brands.size && !S.brands.has(p.brand)) return false;
    if (S.colors.size && !(p.specs.colors || []).some(x => S.colors.has(x))) return false;
    for (const s of c.specs) {
      const f = S.sf[s.k]; if (!f) continue; const v = p.specs[s.k];
      if (s.t === 'n') {
        if (f.min !== undefined && f.min !== '' && !(v >= +f.min)) return false;
        if (f.max !== undefined && f.max !== '' && !(v <= +f.max)) return false;
      }
      if (s.t === 'b' && f.on && !v) return false;
      if (s.t === 's' && f.eq && v !== f.eq) return false;
    }
    return true;
  });
  const so = { rating: (a, b) => score(b).val - score(a).val || b.rating - a.rating, reviews: (a, b) => score(b).n - score(a).n || score(b).val - score(a).val, cheap: (a, b) => a.price - b.price, exp: (a, b) => b.price - a.price };
  return list.sort(so[S.sort]);
}

function viewCatalog() {
  const c = catById(S.cat), g = GROUPS.find(x => x.id === c.g), list = filtered(), items = inCat(S.cat);
  const brands = [...new Set(items.map(p => p.brand))].sort();
  const colors = Object.keys(COLORS).filter(k => items.some(p => (p.specs.colors || []).includes(k)));
  const prices = items.map(p => p.price).filter(Boolean);
  const step = Math.max(...prices) > 20000 ? 1000 : 100;
  const pMin = Math.floor(Math.min(...prices) / step) * step, pMax = Math.ceil(Math.max(...prices) / step) * step;
  const nf = Object.values(S.sf).filter(f => f && (f.on || f.eq || (f.min ?? '') !== '' || (f.max ?? '') !== '')).length + S.brands.size + S.colors.size + (S.maxPrice ? 1 : 0);
  let lastG = '';
  const sfHtml = c.specs.filter(s => s.f && s.t !== 'c').map(s => {
    const f = S.sf[s.k] || {};
    const head = s.g !== lastG ? `<div class="fgroup">${esc(lastG = s.g)}</div>` : '';
    if (s.t === 'n') return head + `<label class="fl">${esc(s.l)}${s.u ? ', ' + s.u : ''}<span class="row2">
      <input type="number" inputmode="decimal" placeholder="от" value="${f.min ?? ''}" data-sf="${s.k}" data-m="min">
      <input type="number" inputmode="decimal" placeholder="до" value="${f.max ?? ''}" data-sf="${s.k}" data-m="max"></span></label>`;
    if (s.t === 'b') return head + `<label class="chk"><input type="checkbox" ${f.on ? 'checked' : ''} data-sf="${s.k}" data-m="on"> ${esc(s.l)}</label>`;
    if (s.t === 's') { const opts = [...new Set(items.map(p => p.specs[s.k]).filter(v => !empty(v)))].sort();
      return head + `<label class="fl">${esc(s.l)}<select data-sf="${s.k}" data-m="eq"><option value="">Любой</option>${opts.map(o => `<option ${f.eq === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`; }
    return '';
  }).join('');
  const siblings = CATEGORIES.filter(x => x.g === c.g), hero = topOf(S.cat);

  return `
  <section class="hero">
    <button class="btn sm all" id="pickcat">Все категории</button>
    ${hero ? illo(hero) : ''}
    <div class="txt"><div class="cap">${esc(g.name)}</div><h1 id="pickcat2" style="font-size:min(36px, calc((min(50vw,410px) - 16px) / ${(Math.max(...c.name.split(' ').map(w => w.length)) * .98 + .8).toFixed(2)}))">${esc(c.name)}<span class="ch">▾</span></h1>
      <div class="sub">${items.length} моделей · от ${rub(Math.min(...prices))}</div></div>
  </section>
  ${siblings.length > 1 ? `<div class="tabs">${siblings.map(x => `<button class="tab2 ${x.id === S.cat ? 'on' : ''}" data-cat="${x.id}">${esc(x.name)}</button>`).join('')}</div>` : ''}
  <div class="searchbar">
    <input type="search" id="q" placeholder="Поиск по бренду или модели" value="${esc(S.q)}">
    <button class="btn sm ${S.showFilters ? 'primary' : ''}" id="tf">Фильтры${nf ? ' · ' + nf : ''}</button>
  </div>
  ${S.showFilters ? `<div class="filters">
    <label class="fl">Цена до: <b>${S.maxPrice ? rub(S.maxPrice) : 'любая'}</b>
      <input type="range" min="${pMin}" max="${pMax}" step="${step}" value="${S.maxPrice || pMax}" id="price"></label>
    <div class="fl">Бренд<div class="chips">${brands.map(b => `<button class="chip ${S.brands.has(b) ? 'on' : ''}" data-brand="${esc(b)}">${esc(b)}</button>`).join('')}</div></div>
    ${colors.length ? `<div class="fl">Цвет<div class="chips">${colors.map(k => `<button class="chip ${S.colors.has(k) ? 'on' : ''}" data-color="${k}">${swatch(k)} ${COLORS[k][0]}</button>`).join('')}</div></div>` : ''}
    ${sfHtml}
    <button class="btn" id="reset">Сбросить фильтры</button>

  <div class="listhead"><span class="cap">Найдено: ${list.length}</span>

  ${list.length ? vgrid(list, p => card(p)) : '<p class="empty">Ничего не нашлось. Ослабьте фильтры.</p>'}

// ---------- Каталог-лист: все категории + поиск ----------
function tilesFor(cats, attr) {

function viewCompare() {

  const c = catById(items[0].cat), n = items.length;

    { l: 'Рейтинг магазина', get: p => p.rating || null, f: v => v ? '★ ' + num(v) : '—', better: 'h', g: G0 },
    { l: 'Отзывы пользователей', get: p => score(p).n ? score(p).users : null, f: (v, p) => v ? `${stars(v)} ${num(v.toFixed(1))}<br><span class="na">${plural(score(p).n, 'отзыв', 'отзыва', 'отзывов')}</span>` : '<span class="na">пока нет</span>', better: 'h', g: G0, keep: 1 },

// ---------- Мастер подбора ----------
const BUDGETS = [3000, 10000, 30000, 50000, 80000, 150000];
function autoQuestions(c) {
  const qs = [];
  const typ = c.specs.find(s => s.t === 's' && s.f);
  if (typ) { const vals = [...new Set(inCat(c.id).map(p => p.specs[typ.k]).filter(v => !empty(v)))];
    if (vals.length > 1) qs.push({ q: typ.l + '?', o: vals.map(v => ({ l: v, c: { k: typ.k, eq: v } })).concat({ l: 'Не важно' }) }); }
  const pr = c.specs.filter(s => s.b && s.t !== 'c' && !['width', 'height', 'depth'].includes(s.k) && inCat(c.id).some(p => !empty(p.specs[s.k]))).slice(0, 8)
    .map(s => ({ l: s.t === 'b' ? s.l : s.k === 'weight' ? 'Лёгкий вес' : s.t === 'e' ? 'Экономия электроэнергии' : `${s.l} — ${s.b === 'h' ? 'побольше' : 'поменьше'}`, w: { [s.k]: 2 } }));
  if (pr.length) qs.push({ q: 'Что важнее всего?', multi: 1, o: pr });
  return qs;
}
function wizSteps(cat) {
  const prices = inCat(cat).map(p => p.price).filter(Boolean), mn = Math.min(...prices), mx = Math.max(...prices);
  const b = BUDGETS.filter(v => v > mn && v < mx);
  return [{ q: 'Бюджет', o: b.map(v => ({ l: 'До ' + rub(v), budget: v })).concat({ l: 'Не ограничен', budget: 0 }) }].concat(WIZARD[cat] || autoQuestions(catById(cat)));
}
function viewWizard() {
  const w = S.wiz;
  if (!w) return `<div class="wiz"><div class="cap" style="margin-top:22px">Подбор</div><h2 style="margin-top:4px">Что подбираем?</h2><p class="sub">Ответьте на пару вопросов — покажем три подходящие модели и объясним выбор.</p>
    ${GROUPS.map(g => `<div class="pgroup"><div class="ph"><span class="cap">${esc(g.name)}</span></div>${tilesFor(CATEGORIES.filter(c => c.g === g.id), 'wcat')}</div>`).join('')}</div>`;
  const steps = wizSteps(w.cat);
  if (w.step >= steps.length) return viewWizResult();
  const st = steps[w.step], ans = w.ans[w.step], c = catById(w.cat);
  return `<div class="wiz"><div class="wizcat"><div class="st">${illo(topOf(w.cat), { bare: 1 })}</div><div><div class="cap">${esc(c.name)}</div><div class="sub" style="margin:2px 0 0">Вопрос ${w.step + 1} из ${steps.length}</div></div></div>
    <div class="progress"><i style="width:${(w.step / steps.length) * 100}%"></i></div>
    <h2>${esc(st.q)}</h2>${st.multi ? '<p class="sub">Можно выбрать несколько</p>' : ''}
    <div class="opts">${st.o.map((o, i) => `<button class="opt ${(st.multi ? (ans || []).includes(i) : ans === i) ? 'on' : ''}" data-opt="${i}">${esc(o.l)}</button>`).join('')}</div>
    <div class="wiznav"><button class="btn" id="wback">Назад</button>${st.multi ? `<button class="btn primary" id="wnext">${(ans || []).length ? 'Показать результат' : 'Пропустить'}</button>` : ''}</div></div>`;
}
function wizScore() {
  const w = S.wiz, c = catById(w.cat), steps = wizSteps(w.cat);
  let budget = 0; const cons = [], weights = {};
  steps.forEach((st, i) => {
    const a = w.ans[i]; if (a === undefined) return;
    (Array.isArray(a) ? a : [a]).forEach(j => { const o = st.o[j];
      if (o.budget !== undefined) budget = o.budget;
      if (o.c) cons.push(o.c);
      if (o.w) Object.entries(o.w).forEach(([k, v]) => weights[k] = (weights[k] || 0) + v); });
  });
  const ok = (p, cn) => { const v = p.specs[cn.k];
    if (cn.min !== undefined && !(v >= cn.min)) return false; if (cn.max !== undefined && !(v <= cn.max)) return false;
    if (cn.eq !== undefined && v !== cn.eq) return false; if (cn.ne !== undefined && v === cn.ne) return false; return true; };
  const scored = inCat(w.cat).map(p => {
    const miss = cons.filter(cn => !ok(p, cn)).length + (budget && p.price > budget ? 1 : 0);
    let s = (score(p).val || 4) - 4; const pros = [], minus = []; if (score(p).n) pros.push(`Отзывы: ★ ${num(score(p).users.toFixed(1))} (${score(p).n})`);
    Object.entries(weights).forEach(([k, wt]) => { const sp = c.specs.find(x => x.k === k); if (!sp || empty(p.specs[k])) return;
      const n = norm(w.cat, sp, p.specs[k]); s += wt * n;

}

}

// ---------- Виртуализация длинных списков ----------
// Если в списке больше VG_MIN карточек, в DOM держим только видимые строки (+ запас VG_BUF сверху и снизу),
// остальное заменяют пустые блоки нужной высоты. Высота строки одинакова (по самой высокой карточке),
// поэтому прокрутка не «прыгает». Миниатюры 3D рисуются только для видимых карточек.
const VG = { items: null, fn: null, cols: 0, rowH: 0, start: -1, end: -1 };
const VG_MIN = 36, VG_BUF = 3;
function vgrid(list, fn) {
  VG.start = VG.end = -1; VG.rowH = 0;

  VG.items = list; VG.fn = fn;

}
const vgCols = () => matchMedia('(min-width:640px)').matches ? 3 : 2;
function vgUpdate(force) {
  const el = $('#vgrid'); if (!el || !VG.items) return;
  const cols = vgCols(), rows = Math.ceil(VG.items.length / cols);
  if (cols !== VG.cols) { VG.cols = cols; VG.rowH = 0; force = true; }
  const rowH = VG.rowH || Math.round(el.clientWidth / cols + 140);
  const top = el.getBoundingClientRect().top + scrollY;
  const first = Math.max(0, Math.floor((scrollY - top) / rowH) - VG_BUF);
  const last = Math.min(rows, Math.max(first + 1, Math.ceil((scrollY + innerHeight - top) / rowH) + VG_BUF));
  if (!force && first === VG.start && last === VG.end) return;
  VG.start = first; VG.end = last;
  el.innerHTML = `<div class="vsp" style="height:${first * rowH - (first ? 1 : 0)}px"${first ? '' : ' hidden'}></div>`
    + VG.items.slice(first * cols, last * cols).map(VG.fn).join('')
    + `<div class="vsp" style="height:${(rows - last) * rowH - 1}px"${rows - last ? '' : ' hidden'}></div>`;
  if (!VG.rowH) {                       // первый показ: меряем самую высокую карточку и фиксируем высоту строки
    el.style.setProperty('--vrow', 'auto');
    const h = Math.max(...[...el.querySelectorAll('.card')].map(c => c.offsetHeight));
    if (h > 0) { VG.rowH = h + 1; el.style.setProperty('--vrow', h + 'px'); return vgUpdate(true); }
  }
  hydrateSoon();
}
let vgRaf = 0;
const vgOnScroll = () => { if (!VG.items || vgRaf) return; vgRaf = requestAnimationFrame(() => { vgRaf = 0; vgUpdate(); }); };
window.addEventListener('scroll', vgOnScroll, { passive: true });
window.addEventListener('resize', () => { if (VG.items) { VG.rowH = 0; vgUpdate(true); } });


// ---------- Комплект: из каких предметов состоит товар ----------
// Первый предмет — основное изделие (его размеры — ширина/высота/глубина из характеристик).
// Если предметов больше одного, в карточке появляется переключатель и вариант «Весь комплект».
const MAIN_NAME = { aircon: 'Внутренний блок', vacuum: 'Робот', waterfilter: 'Фильтр', toothbrush: 'Щётка', shaver: 'Бритва',

    case 'waterfilter': if (s.type !== 'Кувшин') { add('faucet', 'Кран', 5, 32, 18); if (s.type === 'Обратный осмос') add('tank', 'Накопительный бак', 26, 36, 26); } break;
    case 'toothbrush': add('charger', 'Зарядная подставка', 6, 4.5, 6); break;
    case 'shaver': if (s.clean) add('cleanst', 'Станция очистки', 12, 16, 11); break;
    case 'styler': if ((s.attach || 0) > 1) add('attach', 'Насадки', Math.min(s.attach, 8) * 5, 16, 4, s.attach); break;

// ---------- Сводный рейтинг ----------
// Рейтинг магазина считается как 5 «виртуальных» отзывов; реальные отзывы добавляются к нему.
// Так 1–2 отзыва сдвигают оценку немного, а 20 отзывов уже почти полностью определяют её.
const PRIOR = 5;

}

}
// Итог сравнения 0–100
function totals(items, c) {
  const specs = c.specs.filter(s => s.b && ['n', 'b', 'e'].includes(s.t) && !['width', 'height', 'depth'].includes(s.k) && items.some(p => !empty(p.specs[s.k])));
  const rel = (vals) => { const mn = Math.min(...vals), mx = Math.max(...vals); return vals.map(v => mx === mn ? 1 : (v - mn) / (mx - mn)); };
  const specRel = items.map(() => []);
  specs.forEach(s => { const v = items.map(p => norm(c.id, s, p.specs[s.k])); if (new Set(v).size < 2) return; rel(v).forEach((x, i) => specRel[i].push(x)); });
  const price = rel(items.map(p => -(p.price || 0)));
  return items.map((p, i) => {
    const sp = specRel[i].length ? specRel[i].reduce((a, b) => a + b, 0) / specRel[i].length : .5;
    const rt = Math.max(0, Math.min(1, (score(p).val - 3) / 2));
    return { total: Math.round(100 * (.4 * sp + .4 * rt + .2 * price[i])), sp, rt };
  });
}

// ---------- Отзывы ----------

function refreshReviews() {

// ---------- 3D ----------

// ---------- Рендер ----------

<script>// ===== Иллюстрации техники: SVG в реальных пропорциях (единицы = см) и в цвете модели =====
const BODY = { w: '#eceef0', b: '#202226', s: '#c5cad0', x: '#b4bac0', g: '#585d65', e: '#e6dbc5', r: '#c4322f', l: '#3b74bf', n: '#4c9470',
  p: '#e5a8c2', y: '#e4b92f', k: '#b5763f', v: '#7a5bbd', f: '#34363b' };
const DARKS = new Set(['b', 'g', 'f', 'r', 'l', 'n', 'v', 'k']);
let ILLO_ID = 0;

function shade(hex, p) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = p < 0 ? 0 : 255, a = Math.abs(p);
  r = Math.round((t - r) * a + r); g = Math.round((t - g) * a + g); b = Math.round((t - b) * a + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

// Видимые размеры рисунка: для плоских вещей рисуем вид сверху в перспективе
const VIS = {
  hob: (w, h, d) => [w, (d || w * .9) * .55],
  scales: (w, h, d) => [w, (d || w) * .55],
  vacuum: (w, h, d, p) => p.specs.type === 'Робот' ? [w, w * .42] : [w, h],
  egrill: (w, h, d, p) => p.specs.type === 'Открытый' ? [w, Math.max(h, w * .3)] : [w, h],
  iron: (w, h, d) => [d || w * 2.2, h],          // утюг — вид сбоку
  hairdryer: (w, h, d) => [h * .95, h],           // фен — в профиль
  windowbot: (w, h, d) => [w, d || w * .5],       // мойщик — вид на рабочую сторону
};

// ---------- примитивы ----------
const R = (x, y, w, h, r, f, e = '') => `<rect x="${x}" y="${y}" width="${Math.max(w, 0)}" height="${Math.max(h, 0)}" rx="${r}" fill="${f}" ${e}/>`;
const Ci = (x, y, r, f, e = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${e}/>`;
const El = (x, y, rx, ry, f, e = '') => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${e}/>`;
const Pa = (d, f, e = '') => `<path d="${d}" fill="${f}" ${e}/>`;
const Ln = (x1, y1, x2, y2, s, w, e = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" stroke-linecap="round" ${e}/>`;

// ---------- рисовальщики: (W, H, P, p) → svg; P — палитра ----------
const DRAW = {
  fridge(W, H, P, p) {
    const t = p.specs.type || 'Двухкамерный', r = W * .035;
    let s = R(0, 0, W, H * .975, r, P.b) + R(W * .06, H * .975, W * .08, H * .025, 0, P.d) + R(W * .86, H * .975, W * .08, H * .025, 0, P.d);
    const hv = (x, y, h) => R(x, y, W * .022, h, W * .011, P.h);
    if (t === 'Side-by-Side' || t === 'Многодверный') {
      s += R(W * .497, 0, W * .006, t === 'Многодверный' ? H * .55 : H * .975, 0, P.l);
      if (t === 'Многодверный') s += R(0, H * .55, W, H * .006, 0, P.l) + R(W * .497, H * .55, W * .006, H * .425, 0, P.l) + hv(W * .44, H * .62, H * .12) + hv(W * .535, H * .62, H * .12);
      s += hv(W * .44, H * .2, H * .25) + hv(W * .535, H * .2, H * .25) + R(W * .12, H * .14, W * .2, H * .07, W * .01, P.g);
    } else if (t === 'Однокамерный') {
      s += hv(W * .86, H * .1, H * .25);
    } else {
      s += R(0, H * .6, W, H * .007, 0, P.l) + hv(W * .86, H * .32, H * .2) + hv(W * .86, H * .63, H * .12);
      if (p.specs.display) s += R(W * .14, H * .09, W * .2, H * .045, W * .01, P.g) + R(W * .17, H * .105, W * .06, H * .012, 0, P.a);
    }
    return s + R(0, 0, W * .05, H * .975, 0, P.sh);
  },
  freezer(W, H, P, p) {
    if (p.specs.type === 'Ларь') return R(0, H * .18, W, H * .8, W * .02, P.b) + R(-W * .01, 0, W * 1.02, H * .17, W * .02, P.b) + R(0, H * .17, W, H * .012, 0, P.l)
      + R(W * .4, H * .2, W * .2, H * .05, W * .01, P.h) + R(W * .06, H * .3, W * .1, H * .04, W * .01, P.g);
    return R(0, 0, W, H * .97, W * .035, P.b) + R(W * .1, H * .97, W * .8, H * .03, 0, P.d) + R(W * .86, H * .1, W * .022, H * .22, W * .01, P.h)
      + R(W * .1, H * .06, W * .14, H * .03, W * .01, P.g) + R(0, 0, W * .05, H * .97, 0, P.sh);
  },
  wine(W, H, P) {
    let s = R(0, 0, W, H, W * .03, P.b) + R(W * .08, H * .05, W * .84, H * .82, W * .02, P.g);
    for (let y = H * .14; y < H * .82; y += H * .1) { s += R(W * .1, y, W * .8, H * .008, 0, P.l2);
      for (let x = W * .18; x < W * .88; x += W * .16) s += El(x, y - H * .025, W * .06, H * .022, '#5a1e24', 'opacity=".85"'); }
    return s + R(W * .08, H * .9, W * .84, H * .04, W * .01, P.d) + Ci(W * .85, H * .92, W * .015, P.a);
  },
  washer(W, H, P, p) {
    if (p.specs.type === 'Вертикальная') return R(0, 0, W, H, W * .04, P.b) + R(W * .04, H * .02, W * .92, H * .1, W * .03, P.d) + R(W * .1, H * .05, W * .3, H * .04, W * .01, P.g)
      + Ci(W * .78, H * .07, W * .06, P.h) + R(0, H * .14, W, H * .006, 0, P.l) + R(W * .3, H * .9, W * .4, H * .02, 0, P.l) + R(0, 0, W * .05, H, 0, P.sh);
    const cx = W / 2, cy = H * .57, rr = Math.min(W, H) * .32;
    return R(0, 0, W, H, W * .035, P.b) + R(0, H * .17, W, H * .006, 0, P.l) + R(W * .06, H * .05, W * .22, H * .07, W * .015, P.d)
      + R(W * .4, H * .055, W * .26, H * .06, W * .01, P.g) + R(W * .43, H * .075, W * .1, H * .02, 0, P.a) + Ci(W * .82, H * .085, H * .045, P.h)
      + Ci(cx, cy, rr, P.h) + Ci(cx, cy, rr * .82, P.d) + Ci(cx, cy, rr * .7, P.gl) + Pa(`M${cx - rr * .5},${cy - rr * .3} A${rr * .7},${rr * .7} 0 0 1 ${cx + rr * .2},${cy - rr * .62}`, 'none', `stroke="rgba(255,255,255,.35)" stroke-width="${rr * .05}"`)
      + R(W * .1, H * .93, W * .8, H * .006, 0, P.l) + R(0, 0, W * .05, H, 0, P.sh);
  },
  dishwasher(W, H, P, p) {
    const panel = p.specs.builtin ? P.f : P.b;
    return R(0, 0, W, H, W * .03, panel) + R(0, 0, W, H * .1, W * .03, p.specs.builtin ? P.st : P.d) + R(W * .55, H * .03, W * .3, H * .04, W * .01, P.g)
      + R(W * .58, H * .045, W * .1, H * .012, 0, P.a) + R(W * .2, H * .14, W * .6, H * .025, W * .01, P.h) + R(0, H * .1, W, H * .006, 0, P.l)
      + (p.specs.builtin ? '' : R(0, H * .93, W, H * .07, 0, P.d)) + R(0, 0, W * .05, H, 0, P.sh);
  },
  stove(W, H, P, p) {
    let s = R(0, H * .02, W, H * .98, W * .03, P.b) + R(-W * .01, 0, W * 1.02, H * .035, W * .01, P.d) + R(0, H * .04, W, H * .12, 0, P.b2);
    for (let i = 0; i < 4; i++) s += Ci(W * (.16 + i * .14), H * .1, H * .025, P.h) + Ln(W * (.16 + i * .14), H * .1, W * (.16 + i * .14), H * .08, P.d, H * .006);
    s += R(W * .76, H * .08, W * .16, H * .04, W * .01, P.g);
    s += R(W * .06, H * .2, W * .88, H * .6, W * .02, P.d) + R(W * .14, H * .3, W * .72, H * .38, W * .02, P.gl) + R(W * .1, H * .23, W * .8, H * .025, W * .01, P.h);
    return s + R(W * .06, H * .84, W * .88, H * .12, W * .02, P.b2) + R(0, 0, W * .05, H, 0, P.sh);
  },
  hob(W, H, P, p) {
    const sk = W * .08, n = p.specs.burners || 4, th = H * .07;
    let s = Pa(`M${sk},0 L${W - sk},0 L${W},${H - th} L0,${H - th}Z`, P.top) + R(0, H - th, W, th, 0, P.d);
    const pts = n === 2 ? [[.5, .3, .26], [.5, .68, .2]] : n === 3 ? [[.3, .32, .18], [.72, .32, .14], [.5, .7, .2]] : [[.28, .3, .16], [.72, .3, .13], [.28, .68, .2], [.72, .68, .16]];
    const gas = p.specs.type === 'Газовая';
    pts.forEach(([x, y, r]) => { const cx = W * x, cy = (H - th) * y, rx = W * r * .5, ry = (H - th) * r * .55;
      s += gas ? El(cx, cy, rx, ry, P.h) + El(cx, cy, rx * .55, ry * .55, P.d) + Ln(cx - rx, cy, cx + rx, cy, P.d, W * .006) + Ln(cx, cy - ry, cx, cy + ry, P.d, W * .006)
        : El(cx, cy, rx, ry, 'none', `stroke="${P.ring}" stroke-width="${W * .006}"`) + El(cx, cy, rx * .6, ry * .6, 'none', `stroke="${P.ring}" stroke-width="${W * .004}" opacity=".6"`); });
    return s + R(W * .38, (H - th) * .88, W * .24, (H - th) * .06, W * .01, P.ring, 'opacity=".5"');
  },
  oven(W, H, P) {
    let s = R(0, 0, W, H, W * .02, P.b) + R(0, 0, W, H * .15, 0, P.b2) + R(W * .38, H * .045, W * .24, H * .06, W * .01, P.g) + R(W * .42, H * .065, W * .08, H * .02, 0, P.a)
      + Ci(W * .15, H * .075, H * .045, P.h) + Ci(W * .85, H * .075, H * .045, P.h);
    return s + R(W * .06, H * .2, W * .88, H * .74, W * .02, P.d) + R(W * .13, H * .3, W * .74, H * .56, W * .02, P.gl) + R(W * .1, H * .23, W * .8, H * .03, W * .015, P.h);
  },
  hood(W, H, P, p) {
    const t = p.specs.type;
    if (t === 'Наклонная') return R(W * .05, 0, W * .9, H * .55, 0, P.b) + Pa(`M0,${H * .45} L${W},${H * .3} L${W},${H * .92} L0,${H}Z`, P.gl) + R(W * .8, H * .38, W * .08, H * .02, 0, P.a);
    if (t === 'Встраиваемая') return R(0, 0, W, H, W * .02, P.b) + R(W * .05, H * .7, W * .9, H * .3, 0, P.d) + R(W * .4, H * .78, W * .2, H * .12, W * .01, P.h);
    if (t === 'Островная') return R(W * .38, 0, W * .24, H * .7, 0, P.b) + R(0, H * .7, W, H * .3, W * .01, P.b2) + R(W * .05, H * .9, W * .9, H * .1, 0, P.d) + R(W * .8, H * .78, W * .08, H * .03, 0, P.a);
    return R(W * .36, 0, W * .28, H * .55, 0, P.b) + Pa(`M${W * .3},${H * .55} L${W * .7},${H * .55} L${W},${H * .9} L0,${H * .9}Z`, P.b2) + R(0, H * .9, W, H * .1, W * .01, P.d) + Ci(W * .85, H * .95, H * .025, P.a);
  },
  microwave(W, H, P, p) {
    const bi = p.specs.builtin;
    return R(0, 0, W, H, W * .03, P.b) + R(W * .05, H * .1, W * .62, H * .8, W * .02, P.d) + R(W * .09, H * .18, W * .54, H * .64, W * .02, P.gl)
      + R(W * .72, H * .12, W * .2, H * .14, W * .01, P.g) + R(W * .75, H * .17, W * .08, H * .04, 0, P.a)
      + (bi ? R(W * .74, H * .4, W * .16, H * .4, W * .01, P.d) : Ci(W * .82, H * .55, H * .1, P.h) + Ci(W * .82, H * .55, H * .07, P.b2)) + R(0, 0, W * .04, H, 0, P.sh);
  },
  tv(W, H, P) {
    const sh = H * .94;
    return R(W * .2, sh, W * .03, H * .06, 0, P.d) + R(W * .77, sh, W * .03, H * .06, 0, P.d) + R(0, 0, W, sh, W * .006, '#0b0c0e')
      + R(W * .008, W * .008, W - W * .016, sh - W * .016, 0, P.scr) + Pa(`M${W * .55},${W * .008} L${W * .8},${W * .008} L${W * .45},${sh - W * .008} L${W * .2},${sh - W * .008}Z`, 'rgba(255,255,255,.05)');
  },
  aircon(W, H, P) {
    return R(0, 0, W, H, H * .28, P.b) + Pa(`M${W * .03},${H * .72} Q${W / 2},${H * 1.02} ${W * .97},${H * .72} L${W * .97},${H * .78} Q${W / 2},${H * 1.06} ${W * .03},${H * .78}Z`, P.d)
      + R(W * .04, H * .2, W * .92, H * .008, 0, P.l) + Ci(W * .86, H * .45, H * .03, P.a) + R(W * .78, H * .42, W * .05, H * .06, H * .02, P.g) + R(0, 0, W, H * .12, H * .1, P.hi);
  },
  heater(W, H, P, p) {
    const t = p.specs.type;
    if (t === 'Масляный радиатор') { let s = ''; const n = 9, fw = W / n;
      for (let i = 0; i < n; i++) s += R(i * fw + fw * .1, H * .02, fw * .8, H * .86, fw * .35, P.b) + R(i * fw + fw * .1, H * .02, fw * .2, H * .86, fw * .1, P.sh);
      return s + R(W * .05, H * .45, W * .9, H * .05, 0, P.b2) + R(W * .05, H * .88, W * .05, H * .12, 0, P.d) + R(W * .9, H * .88, W * .05, H * .12, 0, P.d) + R(W * .82, H * .2, W * .1, H * .08, W * .02, P.d); }
    if (t === 'Тепловентилятор') { let s = R(0, 0, W, H, W * .12, P.b);
      for (let i = 1; i < 6; i++) s += Ci(W / 2, H * .45, W * .07 * i, 'none', `stroke="${P.d}" stroke-width="${W * .015}"`);
      return s + R(W * .3, H * .82, W * .4, H * .06, W * .02, P.g) + R(W * .35, H * .84, W * .1, H * .02, 0, P.a); }
    if (t === 'Инфракрасный') return R(0, 0, W, H, H * .1, P.b) + R(W * .04, H * .25, W * .92, H * .5, H * .05, '#ff6a2b', 'opacity=".85"') + R(W * .04, H * .25, W * .92, H * .2, H * .05, '#ffd18a', 'opacity=".5"');
    let s = R(0, 0, W, H * .88, W * .015, P.b) + R(W * .03, H * .05, W * .94, H * .1, 0, P.d);
    for (let x = W * .05; x < W * .95; x += W * .025) s += R(x, H * .06, W * .008, H * .08, 0, P.b2);
    return s + R(W * .75, H * .25, W * .18, H * .1, W * .01, P.g) + R(W * .78, H * .28, W * .06, H * .03, 0, P.a) + Pa(`M${W * .1},${H} L${W * .14},${H * .88} L${W * .18},${H}Z`, P.d) + Pa(`M${W * .82},${H} L${W * .86},${H * .88} L${W * .9},${H}Z`, P.d);
  },
  fan(W, H, P, p) {
    const t = p.specs.type;
    if (t === 'Колонный') { let s = R(W * .1, 0, W * .8, H * .9, W * .4, P.b); for (let y = H * .12; y < H * .75; y += H * .025) s += R(W * .22, y, W * .56, H * .008, 0, P.d);
      return s + El(W / 2, H * .95, W / 2, H * .05, P.b2) + Ci(W / 2, H * .05, W * .08, P.a); }
    if (t === 'Безлопастной') return Pa(`M${W * .5},0 C${W * 1.05},0 ${W * 1.05},${H * .62} ${W * .5},${H * .62} C${-W * .05},${H * .62} ${-W * .05},0 ${W * .5},0Z M${W * .5},${H * .06} C${W * .12},${H * .06} ${W * .12},${H * .56} ${W * .5},${H * .56} C${W * .88},${H * .56} ${W * .88},${H * .06} ${W * .5},${H * .06}Z`, P.b, 'fill-rule="evenodd"')
      + R(W * .2, H * .6, W * .6, H * .4, W * .25, P.b2) + Ci(W * .5, H * .85, W * .04, P.a);
    const r = W * .5, cy = r, standTop = r * 2;
    let s = Ci(W / 2, cy, r, P.d) + Ci(W / 2, cy, r * .92, P.gl);
    for (let i = 0; i < 3; i++) { const a = i * 2.094; s += El(W / 2 + Math.cos(a) * r * .45, cy + Math.sin(a) * r * .45, r * .42, r * .2, P.b, `transform="rotate(${a * 57.3} ${W / 2 + Math.cos(a) * r * .45} ${cy + Math.sin(a) * r * .45})" opacity=".9"`); }
    for (let i = 1; i < 5; i++) s += Ci(W / 2, cy, r * .22 * i, 'none', `stroke="${P.l2}" stroke-width="${W * .006}"`);
    s += Ci(W / 2, cy, r * .14, P.b2) + Ci(W / 2, cy, r * .05, P.a);
    return s + R(W * .47, standTop - r * .1, W * .06, H - standTop + r * .05, W * .02, P.b) + El(W / 2, H - H * .015, W * .35, H * .02, P.b2);
  },
  tower(W, H, P, p) {
    const hum = p.cat === 'humidifier';
    let s = R(0, 0, W, H, W * .2, P.b) + R(0, 0, W * .12, H, W * .06, P.sh);
    if (hum) s += R(W * .08, H * .45, W * .84, H * .4, W * .1, '#7fb6d8', 'opacity=".45"') + R(W * .08, H * .65, W * .84, H * .2, W * .1, '#5a9cc6', 'opacity=".5"')
      + Pa(`M${W * .45},${-H * .02} C${W * .3},${-H * .15} ${W * .6},${-H * .22} ${W * .45},${-H * .35}`, 'none', `stroke="${P.mist}" stroke-width="${W * .05}" opacity=".35" stroke-linecap="round"`);
    else for (let y = H * .5; y < H * .95; y += H * .03) s += R(W * .12, y, W * .76, H * .01, 0, P.d);
    for (let x = W * .2; x < W * .85; x += W * .1) s += R(x, H * .03, W * .03, H * .08, 0, P.d);
    return s + R(W * .3, H * .18, W * .4, H * .07, W * .02, P.g) + R(W * .35, H * .2, W * .12, H * .025, 0, P.a);
  },
  waterheater(W, H, P, p) {
    if (p.specs.type === 'Проточный') return R(0, 0, W, H, W * .08, P.b) + R(W * .25, H * .2, W * .5, H * .25, W * .04, P.g) + R(W * .3, H * .26, W * .18, H * .08, 0, P.a)
      + R(W * .3, H * .88, W * .06, H * .12, 0, P.h) + R(W * .64, H * .88, W * .06, H * .12, 0, P.h);
    const rr = p.specs.shape === 'Круглый' ? W * .48 : W * .14;
    return R(0, 0, W, H * .95, rr, P.b) + R(0, 0, W * .14, H * .95, W * .07, P.sh) + Ci(W / 2, H * .3, W * .12, P.g) + Ci(W / 2, H * .3, W * .03, P.a)
      + R(W * .32, H * .95, W * .06, H * .05, 0, P.h) + R(W * .62, H * .95, W * .06, H * .05, 0, P.h);
  },
  speaker(W, H, P, p) {
    let s = R(0, H * .04, W, H * .96, W * .12, P.b);

const partDims = pt => ({ w: +pt.w || 20, h: +pt.h || 20, d: +pt.d || 10, n: pt.n });

const MODELS = new Map();
// part: предмет комплекта из partsOf(p) — undefined/'main' = основное изделие, 'all' = весь комплект рядом
async function buildModel(p, code, part) {
  const pid = part && part.id || 'main';
  if (pid === 'all') return buildSet(p, code);
  const g = new THREE.Group(), s = pid === 'main' ? dimsOf(p) : partDims(part);
  const fn = pid === 'main' ? (B[BUILD_MAP[p.cat]] || ((g, p, c, s) => boxFront(g, p, c, s.w, s.h, s.d, 1))) : PB[pid];
  try { await fn(g, p, code, s); } catch (e) { console.warn('3D', p.id, pid, e); }
  // кондиционер висит на стене, но показываем его стоящим; всё ставим на «пол»
  const bb = new THREE.Box3().setFromObject(g); g.position.y -= bb.min.y;
  return g;
}
// Весь комплект: предметы рядом на одном «полу», в одном масштабе; у каждого — свои размеры
async function buildSet(p, code) {

  const gap = Math.max(...items.map(([, , s]) => s.x)) * .35 + 5;
  items.forEach(([o, bb, s, pt]) => { o.position.x = x - bb.min.x; o.position.z -= (bb.min.z + bb.max.z) / 2; o.userData.part = pt; set.add(o); x += s.x + gap; });

// ---------- миниатюры ----------
// Кэш миниатюр: не больше THUMB_MAX картинок (blob-ссылки), старые освобождаются — память не растёт при длинных списках
const THUMB = new Map(), SZ = 480, THUMB_MAX = 240;

}

async function fill(el) {

  const url = await thumb(p, el.dataset.c, () => el.isConnected);
  if (!url || !el.isConnected) return;
  const img = new Image(); img.alt = ''; img.decoding = 'async'; img.src = url; img.className = 'r3img';

function hydrate(root = document) {

    if (THUMB.has(key)) fill(el); else if (IO) IO.observe(el); else fill(el); });

// ---------- размерные линии в 3D: ширина, высота, глубина ----------
function label(text, R) {
  const c = document.createElement('canvas'), x = c.getContext('2d'), fs = 64;
  x.font = `400 ${fs}px Jost, Inter, sans-serif`; const w = Math.ceil(x.measureText(text).width) + 40;
  c.width = w; c.height = fs + 30; x.font = `400 ${fs}px Jost, Inter, sans-serif`;
  x.fillStyle = 'rgba(12,12,13,.78)'; x.beginPath(); x.roundRect ? x.roundRect(0, 0, w, c.height, 12) : x.rect(0, 0, w, c.height); x.fill();
  x.fillStyle = '#e7c996'; x.textBaseline = 'middle'; x.textAlign = 'center'; x.fillText(text, w / 2, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  const k = R * .065; sp.scale.set(k * w / c.height, k, 1); sp.renderOrder = 10; return sp;
}
// sz — {width,height,depth} для подписей; Rref — общий масштаб подписей (для комплекта)
function dimLines(sz, obj, Rref) {
  if (obj.userData.isSet) { const all = new THREE.Group(), bbs = new THREE.Box3().setFromObject(obj).getSize(V()), R0 = Math.max(bbs.x, bbs.y, bbs.z) * .6;
    obj.updateMatrixWorld(true); obj.children.forEach(o => { const pt = o.userData.part; all.add(dimLines(pt.id === 'main' ? sz : { width: pt.w, height: pt.h, depth: pt.d }, o, R0)); }); return all; }
  obj.updateMatrixWorld(true);
  const g = new THREE.Group(), bb = new THREE.Box3().setFromObject(obj), s = bb.getSize(V()), R = Rref || Math.max(s.x, s.y, s.z);
  const off = R * .07, tick = R * .025, m = new THREE.LineBasicMaterial({ color: '#c9a26b', depthTest: false, transparent: true });
  const seg = (a, b) => { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), m); l.renderOrder = 9; g.add(l); };
  const dim = (a, b, n, text) => {            // a→b — размер, n — направление выноса засечек
    seg(a, b); seg(a.clone().addScaledVector(n, -tick), a.clone().addScaledVector(n, tick)); seg(b.clone().addScaledVector(n, -tick), b.clone().addScaledVector(n, tick));
    const sp = label(text, R); sp.position.copy(a).add(b).multiplyScalar(.5).addScaledVector(n, R * .06); g.add(sp);
  };
  const v = x => (+x ? String(x).replace('.', ',') + ' см' : '');
  const { min, max } = bb, sp = sz;
  if (v(sp.width)) dim(V(min.x, min.y + .2, max.z + off), V(max.x, min.y + .2, max.z + off), V(0, 0, 1), v(sp.width));
  // высота и глубина — на боковой стороне, которую видно с исходного ракурса камеры (слева)
  if (v(sp.height)) dim(V(min.x - off, min.y, max.z), V(min.x - off, max.y, max.z), V(-1, 0, 0), v(sp.height));
  if (v(sp.depth)) dim(V(min.x - off, min.y + .2, max.z), V(min.x - off, min.y + .2, min.z), V(-1, 0, 0), v(sp.depth));
  return g;
}

// ---------- интерактивный 3D-осмотр ----------
let LIVE = null, TOKEN = 0;
async function viewer(el, p, code, opts = {}) {
  const my = ++TOKEN;
  if (LIVE) LIVE.dispose();
  if (!ENV) renderer();
  const part = opts.part; let obj = await buildModel(p, code, part);
  const sz = !part || part.id === 'main' || part.id === 'all' ? p.specs : { width: part.w, height: part.h, depth: part.d };
  if (my !== TOKEN || !el.isConnected) return null;
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  r.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
  r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  const env = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .04).texture;
  el.innerHTML = ''; el.appendChild(r.domElement); r.domElement.className = 'r3view';
  const st = stage(obj, { shadow: .38 }); st.sc.environment = env;
  let dims = null; if (opts.dims) { dims = dimLines(sz, obj); st.sc.add(dims); }
  const cam = new THREE.PerspectiveCamera(30, 1, .1, 5000);
  const ctl = new OrbitControls(cam, r.domElement);
  ctl.enableDamping = true; ctl.dampingFactor = .08; ctl.enablePan = false; ctl.autoRotate = !opts.dims; ctl.autoRotateSpeed = 1.6;
  ctl.minPolarAngle = .1; ctl.maxPolarAngle = Math.PI / 2 - .02;
  const size = () => { const w = el.clientWidth || 360, h = el.clientHeight || 360; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); };
  const aim = (yaw, pitch) => { size(); const c = aimCamera(cam, st, yaw, pitch, 1.08); ctl.target.copy(c); ctl.minDistance = st.R * .6; ctl.maxDistance = st.R * 4; ctl.update(); };
  if (opts.dims) { const sp = st.bb.getBoundingSphere(new THREE.Sphere()); st.bb.expandByScalar(sp.radius * .12); }
  aim(opts.dims ? -.62 : -.5, opts.dims ? .3 : .22);
  ctl.addEventListener('start', () => { ctl.autoRotate = false; });
  let run = true; const loop = () => { if (!run) return; ctl.update(); r.render(st.sc, cam); requestAnimationFrame(loop); }; loop();
  const ro = 'ResizeObserver' in window ? new ResizeObserver(size) : null; ro && ro.observe(el);
  LIVE = {
    pid: p.id, color: code, dims: !!opts.dims, part: part ? part.id : 'main',
    async setColor(c2) { LIVE.color = c2; const o2 = await buildModel(p, c2, part); if (!run) return; st.sc.remove(obj); obj = o2; st.sc.add(obj); },
    setDims(on) { if (dims) { st.sc.remove(dims); dims = null; } if (on) { dims = dimLines(sz, obj); st.sc.add(dims); } LIVE.dims = !!on; },
    reset() { ctl.autoRotate = true; aim(-.5, .22); },
    view(name) { ctl.autoRotate = false; const yaw = { front: 0, side: -Math.PI / 2, top: 0 }[name] ?? -.5; aim(yaw, name === 'top' ? 1.45 : .1); },
    dispose() { run = false; ro && ro.disconnect(); ctl.dispose(); r.dispose(); r.forceContextLoss && r.forceContextLoss(); env.dispose(); if (r.domElement.parentNode) r.domElement.remove(); if (LIVE && LIVE.r === r) LIVE = null; },
    r,
  };
  return LIVE;
}

// ---------- модели рядом в одном масштабе ----------
async function scaleScene(items) {
  const g = new THREE.Group(), pos = [];
  let x = 0; const objs = [];
  for (const p of items) { const o = await buildModel(p, (p.specs.colors || [])[0] || 's'); const bb = new THREE.Box3().setFromObject(o), s = bb.getSize(V()); objs.push([o, bb, s]); }
  const gap = Math.max(...objs.map(([, , s]) => s.x)) * .28;
  objs.forEach(([o, bb, s]) => { o.position.x = x - bb.min.x; o.position.z = -(bb.min.z + bb.max.z) / 2; g.add(o); pos.push([x + s.x / 2, s]); x += s.x + gap; });

  const tw = st.size.x * 1.12, th = st.size.y * 1.25, hw = Math.max(tw, th * aspect) / 2, hh = hw / aspect;
  const cam = new THREE.OrthographicCamera(-hw, hw, hh, -hh, .1, 5000), yaw = -.32, pitch = .16;
  const c = st.bb.getCenter(V()); c.y = st.size.y * .5;
  cam.position.copy(c).add(V(Math.sin(yaw) * 900, Math.sin(pitch) * 900, Math.cos(yaw) * 900)); cam.lookAt(c); cam.updateProjectionMatrix();

}

window.R3 = { hydrate, viewer, scaleScene, thumb, ready: true, live: () => LIVE, stop() { TOKEN++; LIVE && LIVE.dispose(); LIVE = null; } };
window.dispatchEvent(new Event('r3ready'));

</script>
