# ТехноПодбор: на каждое изменение — автотесты; если тесты прошли и это ветка main — выкладка на GitHub Pages
name: ci
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright three@0.160.0
      - run: node tests/run.js index.html
        env: { CHROME: /usr/bin/google-chrome, THREE_DIR: node_modules/three/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-shots, path: tests/shots }
      - run: mkdir _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: _site }
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
