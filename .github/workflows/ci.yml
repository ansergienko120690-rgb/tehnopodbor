# ТехноПодбор: обновление цен → сборка → автотесты → выкладка на GitHub Pages.
#   push в любую ветку — сборка и тесты (выкладка только из main);
#   каждый день в 06:17 МСК — витрина магазинов из фидов (tools/import_feeds.mjs) и цены (tools/update_prices.mjs);
#   если что-то изменилось, коммитит src/data/feed_items.json и prices.json и выкладывает новую версию;
#   вручную — вкладка Actions → ci → Run workflow.
# Адреса фидов магазинов — в секрете репозитория PRICE_FEEDS (Settings → Secrets and variables → Actions).
name: ci
on:
  push:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Характеристики товаров витрины со страниц магазинов (research/specs_cache.json)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 25
        run: node tools/fetch_specs.mjs
      - name: Витрина магазинов из фидов (src/data/feed_items.json)
        if: github.event_name != 'push'
        continue-on-error: true
        run: node tools/import_feeds.mjs
        env: { PRICE_FEEDS: '${{ secrets.PRICE_FEEDS }}' }
      - name: Обновить цены
        if: github.event_name != 'push'
        run: node tools/update_prices.mjs
        env: { PRICE_FEEDS: '${{ secrets.PRICE_FEEDS }}' }
      - name: Сборка
        run: node tools/build.mjs
      - run: npm i --no-save playwright three@0.160.0
      - name: Автотесты
        run: node tests/run.js dist/index.html
        env: { CHROME: /usr/bin/google-chrome, THREE_DIR: node_modules/three/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-shots, path: tests/shots }
      - name: Сохранить новые цены в репозиторий
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "tehnopodbor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in src/data/prices.json src/data/feed_items.json research/specs_cache.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Цены и витрина магазинов на $(date -u +%F)" && git push)
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
